[tool.ruff.lint]
select = ["I"]
[project]
name = "bgtools"
version = "1.0.0"
description = "Boardgame Tools by sumpfork"
authors = [{ name = "Peter Gorniak", email = "sumpfork@mailmight.net" }]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "aws-cdk-aws-lambda-python-alpha>=2.232.1a0",
    "aws-cdk-lib>=2.232.1",
    "cdk-monitoring-constructs>=9.16.0",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
